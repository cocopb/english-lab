<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF8F6">
  <title>문법 — English Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/common.js" defer></script>
  <script src="../assets/js/grammar.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <header class="page-intro">
      <p class="eyebrow">GRAMMAR</p>
      <h1>문법 정리</h1>
      <p>규칙을 짧게 정리하고 예문으로 확인해요.</p>
    </header>
    <section class="content-section grammar-workspace">
      <div class="vocab-tabs" role="tablist" aria-label="문법 학습 메뉴">
        <button class="vocab-tab" id="grammar-tab-notes" type="button" role="tab" aria-controls="grammar-panel-notes" aria-selected="true">문법 노트</button>
        <button class="vocab-tab" id="grammar-tab-quiz" type="button" role="tab" aria-controls="grammar-panel-quiz" aria-selected="false" tabindex="-1">문법 문제</button>
        <button class="vocab-tab" id="grammar-tab-weak" type="button" role="tab" aria-controls="grammar-panel-weak" aria-selected="false" tabindex="-1">약점 유형</button>
      </div>
      <section class="vocab-tab-panel" id="grammar-panel-notes" role="tabpanel" aria-labelledby="grammar-tab-notes">
        <div class="grammar-notes-heading">
          <h2>문법 노트</h2>
          <button class="button button-quiet" id="grammar-expand-toggle" type="button" aria-expanded="false">전체 펼치기</button>
        </div>
        <div id="grammar-list" class="grammar-list"></div>
      </section>
      <section class="vocab-tab-panel" id="grammar-panel-quiz" role="tabpanel" aria-labelledby="grammar-tab-quiz" hidden>
        <h2>문법 문제</h2>
        <form class="panel grammar-quiz-settings" id="grammar-quiz-form">
          <label class="field" for="grammar-quiz-rule">유형
            <select id="grammar-quiz-rule"></select>
          </label>
          <label class="field" for="grammar-quiz-count">문항 수
            <select id="grammar-quiz-count">
              <option value="10">10문제</option>
              <option value="20">20문제</option>
              <option value="all">전체</option>
            </select>
          </label>
          <p class="grammar-quiz-message" id="grammar-quiz-message" aria-live="polite"></p>
          <button class="button button-primary" type="submit">시작</button>
        </form>
        <div class="grammar-quiz-stage" id="grammar-quiz-stage" aria-live="polite" hidden></div>
      </section>
      <section class="vocab-tab-panel" id="grammar-panel-weak" role="tabpanel" aria-labelledby="grammar-tab-weak" hidden>
        <h2>약점 유형</h2>
        <div id="grammar-weak-list" class="grammar-weak-list"></div>
        <button class="button button-primary" id="grammar-weak-practice" type="button" disabled>약점 유형만 집중 연습</button>
      </section>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../data/grammar.js"></script>
</body>
</html>
