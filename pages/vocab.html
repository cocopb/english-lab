<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FAF8F6">
  <title>보카 — English Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/common.js" defer></script>
</head><body>
  <div id="site-header"></div><main class="container">
    <header class="page-intro"><p class="eyebrow">VOCABULARY</p><h1>보카 노트</h1><p>오늘 외운 단어를 기록하고, 나만의 어휘장을 채워보세요.</p></header>
    <section class="content-section"><h2>해커스 보카 진도</h2><div class="panel">
      <form class="form-row" id="vocab-form"><label class="field" for="vocab-day">마지막으로 공부한 Day<input id="vocab-day" type="number" min="0" max="999" step="1" value="0" inputmode="numeric" required></label><button class="button button-primary" type="submit">진도 저장</button></form>
      <p class="helper-text" id="vocab-message" aria-live="polite">숫자만 입력해 간단히 기록해요.</p>
    </div></section>
    <section class="content-section"><h2>단어 목록</h2><div id="vocab-list" class="vocab-list"></div></section>
  </main><div id="site-footer"></div>
  <script src="../data/vocab.js"></script><script>
    document.addEventListener("DOMContentLoaded", function () {
      var progress = window.Progress.get();
      document.getElementById("vocab-day").value = progress.vocabDay;
      document.getElementById("vocab-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var day = Number(document.getElementById("vocab-day").value);
        if (!Number.isInteger(day) || day < 0) {
          document.getElementById("vocab-message").textContent = "0 이상의 정수를 입력해주세요.";
          return;
        }
        window.Progress.set({ vocabDay: day });
        document.getElementById("vocab-message").textContent = "Day " + day + "까지의 진도를 저장했어요.";
      });
      var container = document.getElementById("vocab-list");
      var groups = [];
      window.VOCAB.forEach(function (item) {
        var key = item.track + "-" + item.day;
        var group = groups.find(function (entry) { return entry.key === key; });
        if (!group) {
          group = { key: key, track: item.track, day: item.day, items: [] };
          groups.push(group);
        }
        group.items.push(item);
      });

      groups.forEach(function (group) {
        var table = document.createElement("table");
        table.className = "vocab-table";
        var caption = document.createElement("caption");
        caption.textContent = group.track.toUpperCase() + " · DAY " + group.day;
        table.appendChild(caption);

        var head = document.createElement("thead");
        var headerRow = document.createElement("tr");
        ["단어", "뜻", "예문", "학습 메모"].forEach(function (label) {
          var cell = document.createElement("th");
          cell.scope = "col";
          cell.textContent = label;
          headerRow.appendChild(cell);
        });
        head.appendChild(headerRow);
        table.appendChild(head);

        var body = document.createElement("tbody");
        group.items.forEach(function (item) {
          var row = document.createElement("tr");
          var word = document.createElement("td");
          word.dataset.label = "단어";
          var wordText = document.createElement("span");
          wordText.className = "vocab-word en";
          wordText.textContent = item.word;
          var pos = document.createElement("span");
          pos.className = "vocab-pos";
          pos.textContent = item.pos;
          word.append(wordText, pos);
          row.appendChild(word);

          var meaning = document.createElement("td");
          meaning.dataset.label = "뜻";
          meaning.textContent = item.meaning;
          row.appendChild(meaning);

          var example = document.createElement("td");
          example.dataset.label = "예문";
          var sentence = document.createElement("span");
          sentence.className = "vocab-example en";
          sentence.textContent = item.example;
          var translation = document.createElement("span");
          translation.className = "vocab-example-ko";
          translation.textContent = item.exampleKo;
          example.append(sentence, translation);
          row.appendChild(example);

          var note = document.createElement("td");
          note.dataset.label = "학습 메모";
          var tip = document.createElement("p");
          tip.className = "vocab-tip";
          tip.textContent = item.tip;
          note.appendChild(tip);
          var details = document.createElement("p");
          details.className = "vocab-details";
          details.textContent = "혼동 단어: " + item.distractors.join(", ") + " · 태그: " + item.tags.join(", ");
          note.appendChild(details);
          row.appendChild(note);
          body.appendChild(row);
        });
        table.appendChild(body);
        container.appendChild(table);
      });
    });
  </script>
</body></html>
