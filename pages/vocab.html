<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FAF8F6">
  <title>보카 — English Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/common.js" defer></script>
</head><body>
  <div id="site-header"></div><main class="container">
    <header class="page-intro"><p class="eyebrow">VOCABULARY</p><h1>보카 노트</h1><p>오늘 외운 단어를 기록하고, 나만의 어휘장을 채워보세요.</p></header>
    <section class="content-section"><h2>해커스 보카 진도</h2><div class="panel">
      <form class="form-row" id="vocab-form"><label class="field" for="vocab-day">마지막으로 공부한 Day<input id="vocab-day" type="number" min="0" max="999" step="1" value="0" inputmode="numeric" required></label><button class="button button-primary" type="submit">진도 저장</button></form>
      <p class="helper-text" id="vocab-message" aria-live="polite">숫자만 입력해 간단히 기록해요.</p>
    </div></section>
    <section class="content-section vocab-workspace">
      <div class="vocab-tabs" role="tablist" aria-label="보카 학습 메뉴">
        <button class="vocab-tab" id="vocab-tab-list" type="button" role="tab" aria-controls="vocab-panel-list" aria-selected="true">단어장</button>
        <button class="vocab-tab" id="vocab-tab-exam" type="button" role="tab" aria-controls="vocab-panel-exam" aria-selected="false" tabindex="-1">보카 시험</button>
        <button class="vocab-tab" id="vocab-tab-wrong" type="button" role="tab" aria-controls="vocab-panel-wrong" aria-selected="false" tabindex="-1">오답 공부</button>
      </div>
      <section class="vocab-tab-panel" id="vocab-panel-list" role="tabpanel" aria-labelledby="vocab-tab-list">
        <h2>단어 목록</h2>
        <div class="vocab-controls" aria-label="단어 검색 및 필터">
          <label class="field" for="vocab-track">트랙
            <select id="vocab-track"><option value="all">전체</option><option value="toeic">토익</option><option value="speaking">회화</option><option value="toefl">토플</option></select>
          </label>
          <label class="field" for="vocab-day-filter"><span id="vocab-day-filter-label">Day</span>
            <select id="vocab-day-filter"><option value="all">전체</option></select>
          </label>
          <label class="field vocab-search-field" for="vocab-search">검색
            <input id="vocab-search" type="search" placeholder="영어 단어 또는 한글 뜻">
          </label>
          <button class="button button-quiet vocab-hide-toggle" id="vocab-hide-toggle" type="button" aria-pressed="false">뜻 가리기</button>
        </div>
        <p class="vocab-result-count" id="vocab-result-count" aria-live="polite"></p>
        <div id="vocab-list" class="vocab-list"></div>
      </section>
      <section class="vocab-tab-panel" id="vocab-panel-exam" role="tabpanel" aria-labelledby="vocab-tab-exam" hidden>
        <h2>보카 시험</h2>
        <form class="panel vocab-exam-settings" id="vocab-exam-form">
          <label class="field" for="vocab-exam-track">트랙
            <select id="vocab-exam-track"><option value="toeic">토익</option><option value="speaking">회화</option><option value="toefl">토플</option></select>
          </label>
          <label class="field" for="vocab-exam-day"><span id="vocab-exam-day-label">Day</span>
            <select id="vocab-exam-day"></select>
          </label>
          <label class="field" for="vocab-exam-type">시험 유형
            <select id="vocab-exam-type"><option value="meaning">뜻 시험</option><option value="blank">빈칸 시험</option></select>
          </label>
          <label class="field" for="vocab-exam-range">범위
            <select id="vocab-exam-range">
              <option value="1-10">1회차 (1~10)</option>
              <option value="11-20">2회차 (11~20)</option>
              <option value="21-30">3회차 (21~30)</option>
              <option value="all">전체 30문제</option>
            </select>
          </label>
          <p class="vocab-exam-message" id="vocab-exam-message" aria-live="polite"></p>
          <button class="button button-primary" type="submit">시험 시작</button>
        </form>
        <div id="vocab-exam-stage" class="vocab-exam-stage" aria-live="polite" hidden></div>
      </section>
      <section class="vocab-tab-panel" id="vocab-panel-wrong" role="tabpanel" aria-labelledby="vocab-tab-wrong" hidden>
        <h2>오답 공부</h2>
        <div class="vocab-review-summary" aria-live="polite">
          <article class="vocab-review-stat"><span>오늘 복습할 단어</span><strong id="vocab-due-count">0개</strong></article>
          <article class="vocab-review-stat"><span>약점 단어</span><strong id="vocab-weak-count">0개</strong></article>
          <article class="vocab-review-stat"><span>졸업한 단어</span><strong id="vocab-graduated-count">0개</strong></article>
        </div>
        <section class="vocab-review-section">
          <h3>오늘의 복습</h3>
          <div id="vocab-due-list" class="list-stack"></div>
          <button class="button button-primary" id="vocab-review-start" type="button">복습 시험 시작</button>
        </section>
        <section class="vocab-review-section">
          <h3>약점 단어 목록</h3>
          <div id="vocab-wrong-list"></div>
        </section>
      </section>
    </section>
  </main><div id="site-footer"></div>
  <script src="../data/vocab.js"></script><script src="../assets/js/vocab.js" defer></script>
</body></html>
