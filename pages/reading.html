<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF8F6">
  <title>독해 — English Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/common.js" defer></script>
  <script src="../assets/js/reading.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <header class="page-intro">
      <p class="eyebrow">READING · TOEIC PART 7</p>
      <h1>독해 연습</h1>
      <p>지문에서 근거를 찾아 읽고, 문장별 해석으로 확인해요.</p>
    </header>
    <section class="content-section reading-workspace">
      <div class="vocab-tabs" role="tablist" aria-label="독해 학습 메뉴">
        <button class="vocab-tab" id="reading-tab-strategy" type="button" role="tab" aria-controls="reading-panel-strategy" aria-selected="false" tabindex="-1">읽기 전략</button>
        <button class="vocab-tab" id="reading-tab-passages" type="button" role="tab" aria-controls="reading-panel-passages" aria-selected="true">지문 읽기</button>
        <button class="vocab-tab" id="reading-tab-review" type="button" role="tab" aria-controls="reading-panel-review" aria-selected="false" tabindex="-1">다시 읽기</button>
      </div>
      <section class="vocab-tab-panel" id="reading-panel-strategy" role="tabpanel" aria-labelledby="reading-tab-strategy" hidden>
        <div class="grammar-notes-heading">
          <h2>읽기 전략</h2>
          <button class="button button-quiet" id="reading-expand-toggle" type="button" aria-expanded="false">전체 펼치기</button>
        </div>
        <div id="reading-strategy-list" class="reading-strategy-list"></div>
      </section>
      <section class="vocab-tab-panel" id="reading-panel-passages" role="tabpanel" aria-labelledby="reading-tab-passages">
        <h2>지문 읽기</h2>
        <div class="panel reading-passage-picker">
          <label class="field" for="reading-passage-select">지문 선택
            <select id="reading-passage-select"></select>
          </label>
          <button class="button button-primary" id="reading-open-passage" type="button">지문 열기</button>
        </div>
        <div id="reading-exercise" class="reading-exercise"></div>
      </section>
      <section class="vocab-tab-panel" id="reading-panel-review" role="tabpanel" aria-labelledby="reading-tab-review" hidden>
        <h2>다시 읽기</h2>
        <div id="reading-review-list" class="reading-review-list"></div>
      </section>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../data/reading.js"></script>
</body>
</html>
